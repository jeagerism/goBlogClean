# Cloud Build: test → build image → push to Artifact Registry → deploy Cloud Run
steps:
  # Step 1 — unit tests
  - id: test
    name: golang:1.21
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go mod download
        go test -v ./...

  # Step 2 — Docker build
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:latest'
      - .

  # Step 3 — push image
  - id: push-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -eo pipefail
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO}/${_SERVICE_NAME}:${SHORT_SHA}"
        docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO}/${_SERVICE_NAME}:latest"

  # Step 4 — deploy to Cloud Run (เชื่อมต่อ Secret Manager ตรงนี้)
  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--max-instances=3'
      - '--allow-unauthenticated'
      # แก้ไขจุดนี้: ดึงค่าจาก Secret Manager มาใส่ใน Env ของแอป
      - '--set-secrets=DATABASE_URL=DB_URL:latest,JWT_SECRET=JWT_SECRET:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-southeast1
  _GAR_REPO: goblogclean-gar
  _SERVICE_NAME: goblogclean
  # ลบ _DATABASE_URL และ _JWT_SECRET ออกจากที่นี่แล้ว เพราะใช้ Secret Manager แทน